<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Semanal</title>
    <link rel="stylesheet" href="style-playlists.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://www.ifsc.edu.br/o/ifsc-internet-lf6_2-theme/images/favicon.ico">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
  <div class="container-fluid">

    <a class="navbar-brand fw-bold" href="/controller-tester.html">Painel de Controle</a>
    <div class="d-flex align-items-center gap-2">
      <a href="/controller-tester.html" class="btn btn-outline-secondary">← Voltar</a>
    </div>

  </div>
</nav>
    <h2>Calendário Semanal</h2>

<div class="acoes-playlist">

    <button
      class="btn-playlist"
      onclick="salvarCalendario()"
    >
      Aplicar e Salvar
    </button>

    <button
      class="btn-playlist destaque"
      onclick="aplicarTodas()"
    >
      Aplicar em todas as telas
    </button>

  </div>

  <p class="titulosh2">Página em construção</p>
<script>

let params = new URLSearchParams(window.location.search);
let tv = params.get("tv");

function voltarMenu() {
  window.location.href = "/controller-tester.html"; }

  
async function aplicarTodas(){

  let playlist = [
    {
      src: "https://calendar.app.google/k9PBMSEQGbYdtkgz8",
      duracao: 60
    }
  ];

  await fetch("/update-all", {

    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      pagina: "calendario",
      type: "calendario",
      intervalo: 0,
      items: playlist
    })
  });

  alert("Calendário aplicado em todas as TVs");
}


async function salvarCalendario(){

  let playlist = [
    {
      src: "https://calendar.app.google/k9PBMSEQGbYdtkgz8",
      duracao: 60
    }
  ];

  // salva playlist
  await fetch("/save-playlist", {
  
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      tv: tv,
      type: "calendario",
      items: playlist
    })
  });

  // muda viewer
  await fetch("/update", {

    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
    tv: tv,
    pagina: "calendario",
    intervalo: 0,
    })
  });

  alert("Calendário enviado!");
  window.location.href = "/controller-tester.html";
}

</script>
</body>
</html>
