<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlists</title>
<link rel="stylesheet" href="style-playlists.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/png" href="https://www.ifsc.edu.br/o/ifsc-internet-lf6_2-theme/images/favicon.ico">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/controller-tester.html">Painel de Controle</a>

    <div class="d-flex align-items-center">
      <a href="/controller-tester.html" class="btn btn-outline-secondary">← Voltar</a>
    </div>
  </div>
</nav>

<div class="container">
  <div>
    <button class="btn-adicionar-playlist" onclick="mostrarInputs()">
      <span>Adicionar Nova Playlist</span>
    </button>
  </div>

  <div id="nova-playlist-form">
    <div class="playlist-form-header">
      <h3 id="titulo-form-playlist">Nova Playlist</h3>
      <button type="button" class="btn-fechar-form" onclick="fecharFormularioPlaylist()">✕</button>
    </div>

    <div class="campo-playlist">
      <label for="playlist-titulo">Nome da playlist</label>
      <input id="playlist-titulo" type="text" placeholder="Digite o nome da playlist">
    </div>

    <div id="area-ordem-playlist" class="campo-playlist" style="display:none;">
      <label>Ordem dos conteúdos</label>
      <p class="ajuda-ordem-playlist">Arraste os conteúdos para definir a ordem em que serão exibidos.</p>
      <div id="lista-ordem-playlist"></div>
    </div>

    <div class="campo-playlist">
      <label>
        <span id="titulo-conteudos-disponiveis">Selecione os conteúdos</span>
      </label>
      <div id="lista-conteudos"></div>
    </div>

    <div class="acoes-form-playlist">
      <button class="btn-playlist" onclick="salvarPlaylist()">Salvar Playlist</button>
      <button class="btn-cancelar-aviso" onclick="fecharFormularioPlaylist()">Cancelar</button>
    </div>
  </div>
  
  <div>
    <h2 class="titulosh2">Playlists Adicionadas</h2>
    <div id="lista-playlists"></div>
  </div>

  <div class="acoes-playlist" id="acoes-playlist">
    <button class="btn-playlist" onclick="aplicarPlaylist()">Aplicar Playlist</button>
    <button class="btn-delete" onclick="excluirPlaylist()">Deletar</button>
    <button class="btn-editar" onclick="editarPlaylist()">Editar</button>
  </div>

  <div id="tv-modal" class="modal-tv">
    <div class="modal-tv-content">
      <h2>Escolha uma TV</h2>
      <div id="lista-tvs-modal"></div>
      <button class="btn-playlist" onclick="fecharModalTV()">Cancelar</button>
    </div>
  </div>
</div>

<script>

//VARIÁVEIS
let playlists = [];            
let playlistSelecionada = null;
let playlistEditando = null;
let conteudosDisponiveis = [];
let itensOrdenados = [];

// TV ATUAL
const params = new URLSearchParams(window.location.search);
const tv = params.get("tv");

//ESCOLHER TVS PARA APLICAR
async function obterTVs(){

  const res = await fetch("/state");
  const state = await res.json();

  return Object.keys(state);
}

function fecharModalTV(){
  document.getElementById("tv-modal").style.display = "none";
}

async function escolherTV(){
  return new Promise(async resolve => {

    const tvs = await obterTVs();
    const lista = document.getElementById("lista-tvs-modal");

    lista.innerHTML = "";
    tvs.forEach(tv => {

      const btn = document.createElement("button");
      btn.className = "btn-tv-modal";
      btn.textContent = tv;

      btn.onclick = () => {
        fecharModalTV();
        resolve(tv);
      };
      lista.appendChild(btn);
    });

    document.getElementById("tv-modal").style.display = "flex";
  });
}

//CARREGAR CONTEÚDOS
async function carregarConteudos(){
  const res = await fetch("/conteudos");
  conteudosDisponiveis = await res.json();
  renderizarConteudos();
}

//RENDERIZAR CONTEÚDOS 
function renderizarConteudos() {
  const lista = document.getElementById("lista-conteudos");
  lista.innerHTML = "";

  conteudosDisponiveis.forEach(item => {
    const div = document.createElement("div");
    div.className = "conteudo-item";
    const estaNaPlaylist = itensOrdenados.some(conteudo => conteudo.id === item.id);

    div.innerHTML = `
      <label>
        <input type="checkbox" value="${item.id}" ${estaNaPlaylist ? "checked" : ""}>
        <span class="conteudo-info">
          <strong>${item.titulo}</strong>
          <small>${item.tipo || "Conteúdo"} • ${item.duracao || 30}s</small>
        </span>
      </label>
    `;

    const checkbox = div.querySelector("input");

    checkbox.addEventListener("change",() => {
        if (checkbox.checked) {
          const existe = itensOrdenados.some(conteudo => conteudo.id === item.id);
          if (!existe) {
            itensOrdenados.push(item);
          }
        } else {
          itensOrdenados = itensOrdenados.filter(conteudo => conteudo.id !== item.id);
        }
        renderizarOrdemPlaylist();
    });
    lista.appendChild(div);
  });
  renderizarOrdemPlaylist();
}

// RENDERIZAR ORDEM DA PLAYLIST
function renderizarOrdemPlaylist() {
  const area = document.getElementById("area-ordem-playlist");
  const lista = document.getElementById("lista-ordem-playlist");

  if (!playlistEditando) {
    area.style.display = "none";
    return;
  }

  area.style.display = "block";
  lista.innerHTML = "";

  if (itensOrdenados.length === 0) {
    lista.innerHTML = `
      <div class="ordem-vazia">
        Nenhum conteúdo selecionado.
      </div>`;
    return;
  }

  itensOrdenados.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "item-ordem-playlist";
    div.draggable = true;
    div.dataset.id = item.id;
    div.innerHTML = `
      <span class="drag-handle">☰</span>
      <span class="numero-item">${String(index + 1).padStart(2, "0")}</span>
      <span class="ordem-info">
        <strong>${item.titulo}</strong>
        <small>${item.tipo || "Conteúdo"} • ${item.duracao || 30}s</small>
      </span>`;

    adicionarEventosDragDrop(div);
    lista.appendChild(div);
  });
}

//DRAG AND DROP
function adicionarEventosDragDrop(elemento) {
  elemento.addEventListener("dragstart",() => {
    elemento.classList.add("arrastando");
    }
  );

  elemento.addEventListener("dragend", () => {
    elemento.classList.remove("arrastando");
      atualizarOrdemDosItens();
    }
  );

  elemento.addEventListener("dragover", evento => {
    evento.preventDefault();
    const arrastando = document.querySelector(".item-ordem-playlist.arrastando");

      if (!arrastando || arrastando === elemento) {
        return;
      }

      const lista = document.getElementById("lista-ordem-playlist");
      const itens = [...lista.querySelectorAll(".item-ordem-playlist")];
      const indiceArrastando = itens.indexOf(arrastando);
      const indiceDestino = itens.indexOf(elemento);

      if (indiceArrastando < indiceDestino) {
        elemento.after(arrastando);
      } else {
        elemento.before(arrastando);
      }
    });
}

function atualizarOrdemDosItens() {
  const lista = document.getElementById("lista-ordem-playlist");
  const ids = [...lista.querySelectorAll(".item-ordem-playlist")].map(item => item.dataset.id);

  itensOrdenados = ids.map(id =>
    conteudosDisponiveis.find(item => item.id === id)
  ).filter(Boolean);
  renderizarOrdemPlaylist();
}

// SALVAR PLAYLIST PARA ADICIONAR
async function salvarPlaylist(){
  const titulo = document.getElementById("playlist-titulo").value.trim();

  if (!titulo) {
    alert("Digite um nome para a playlist.");
    return;
  }

  if (playlistEditando) {
    atualizarOrdemDosItens();
  }

  const itens = playlistEditando ? [...itensOrdenados] : [...document.querySelectorAll("#lista-conteudos input:checked")]
    .map(check => conteudosDisponiveis.find(item => item.id === check.value)).filter(Boolean);

  if (itens.length === 0) {
    alert("Selecione pelo menos um conteúdo.");
    return;
  }

  const dados = {titulo, items: itens};

  try {

    if (playlistEditando) {
      await fetch("/playlists-salvas/" + playlistEditando.id, {
        method: "PUT",
        headers: {"Content-Type":"application/json"},
        body:JSON.stringify(dados)
        });

    } else {
      await fetch("/playlists-salvas", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(dados)
      });
    }

    playlistEditando = null;
    itensOrdenados = [];
    document.getElementById("playlist-titulo").value = "";

    fecharFormularioPlaylist();
    playlistSelecionada = null;
    await carregarPlaylists();

  } catch (erro) {
    console.error("Erro ao salvar playlist:",erro);
    alert("Erro ao salvar a playlist.");
  }
}

//CARREGAR PLAYLISTS
async function carregarPlaylists(){
  const res = await fetch("/playlists-salvas");
  playlists = await res.json();
  renderizarPlaylists();
}

//RENDERIZAR PLAYLISTS
function renderizarPlaylists(){

  const lista =document.getElementById("lista-playlists");
  lista.innerHTML="";

  playlists.forEach(pl=>{
    const card=document.createElement("div");
    card.className="card-playlist";

    if(
      playlistSelecionada &&
      playlistSelecionada.id===pl.id
    ){
      card.classList.add("selecionado");
    }

    const total=  pl.items.reduce((s,i)=>s+(i.duracao||30),0);
    let itensHTML="";

      pl.items.forEach((item,index)=>{
        itensHTML+=`
          <div class="playlist-item">
            <span>
              ${String(index+1).padStart(2,"0")}.
              ${item.titulo}
            </span>

            <span>
              ${item.duracao||30}s
            </span>
          </div> `;
      });

      const selecionada =
        playlistSelecionada &&
        playlistSelecionada.id === pl.id;


      card.innerHTML = `
        <div class="playlist-card-header">
          <h3>${pl.titulo}</h3>
          <span class="playlist-status">${pl.items.length} itens</span>
        </div>

        <div class="playlist-resumo">
          <span>
            Duração: 
            ${Math.floor(total / 60)} min
            ${String(total % 60).padStart(2, "0")} s
          </span>
        </div>

        <div class="itens-playlist">
          ${itensHTML}
        </div>
        
        <button class="selecionar-btn">${selecionada ? "✓ Selecionada" : "Selecionar"}</button>
      `;

        card.onclick = () => {

          if (playlistSelecionada && playlistSelecionada.id === pl.id) {
            playlistSelecionada = null;
          } else {
            playlistSelecionada = pl;
          }
          renderizarPlaylists();
        };
        lista.appendChild(card);
    });
    mostrarAcoesPlaylist();
}

//APLICAR PLAYLIST
async function aplicarPlaylist(){

  if(!playlistSelecionada){
    alert("Selecione uma playlist.");
    return;
  }

  const tv = await escolherTV();
  if(!tv) return;

  await fetch("/playlist/aplicar",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      tv,
      playlistId: playlistSelecionada.id
    })
  });

  await fetch("/update",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      tv,
      refresh: Date.now()
    })
  });

  playlistSelecionada = null;
  carregarPlaylists();
  alert("Playlist aplicada.");
  window.location.href = "/controller-tester.html";
}

//ADICIONAR PLAYLIST
async function adicionarPlaylist(){
  playlistEditando = null;
  itensOrdenados = [];

  document.getElementById("titulo-form-playlist").textContent = "Nova Playlist";
  document .getElementById("playlist-titulo").value = "";
  document.getElementById("area-ordem-playlist").style.display = "none";

  await carregarConteudos();

  document.querySelectorAll("#lista-conteudos input").forEach(check =>check.checked = false);
  document.getElementById("nova-playlist-form").style.display ="block";
}

// EDITAR PLAYLIST (NOME, DURAÇÃO E ITENS)
async function editarPlaylist(){

  if (!playlistSelecionada) {
    alert("Selecione uma playlist.");
    return;
  }

  playlistEditando = playlistSelecionada;
  document.getElementById("titulo-form-playlist").textContent = "Editar Playlist";
  document.getElementById("playlist-titulo").value = playlistSelecionada.titulo;

  itensOrdenados = [...playlistSelecionada.items];
  await carregarConteudos();
  document.getElementById("nova-playlist-form").style.display = "block";
  renderizarConteudos();
  renderizarOrdemPlaylist();
}

//EXCLUIR PLAYLIST
async function excluirPlaylist(){

  if(!playlistSelecionada){
    alert("Selecione uma playlist.");
    return;
  }

  if(!confirm(`Excluir "${playlistSelecionada.titulo}"?`)){
    return;
  }

  await fetch("/playlists-salvas/" + playlistSelecionada.id,{
    method:"DELETE"
  });

  playlistSelecionada = null;
  carregarPlaylists();
}

// MOSTRAR INPUTS
function mostrarInputs(){
  const form=document.getElementById("nova-playlist-form");

  if(form.style.display==="block"){
    form.style.display="none";
    return;
  }
  adicionarPlaylist();
}

// MOSTRAR BOTÕES 
function mostrarAcoesPlaylist(){
  document.getElementById("acoes-playlist").style.display = playlistSelecionada ?"flex" :"none";
}

function fecharFormularioPlaylist() {

  playlistEditando = null;
  itensOrdenados = [];

  document.getElementById("titulo-form-playlist").textContent = "Nova Playlist";
  document.getElementById("nova-playlist-form").style.display = "none";
  document.getElementById("lista-ordem-playlist").innerHTML = "";
}

// VOLTAR
function voltar(){
  window.location.href = "/controller-tester.html";
}

// INIT
(async ()=>{
  await carregarPlaylists();
  document.getElementById("nova-playlist-form").style.display="none";
})();

</script>
</body>
</html>
