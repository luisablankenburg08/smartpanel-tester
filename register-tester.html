<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar cadastro</title>
  <link rel="stylesheet" href="register-tester.css">
  <link rel="icon" type="image/png" href="https://www.ifsc.edu.br/o/ifsc-internet-lf6_2-theme/images/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <main class="users-page">
    <section class="users-panel">
    <div class = "recado">
        <h1>Solicitar cadastro</h1>
        <p>Após o cadastro, aguarde a aprovação do administrador para acessar o sistema.</p>
    </div>
    
      <form id="registerForm">
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" maxlength="80" required placeholder="Digite seu nome de usuário">

        <label for="password">Senha</label>
          <div class="campo-senha">
            <input id="password" name="password" type="password" minlength="8" required placeholder="Digite sua senha">

            <button type="button" class="btn-olho toggle-senha" data-target="password" aria-label="Mostrar senha">
              <i class="bi bi-eye"></i>
            </button>
          </div>

          <label for="passwordConfirmation">Confirmar senha</label>

          <div class="campo-senha">
            <input id="passwordConfirmation" name="passwordConfirmation" type="password" minlength="8" required placeholder="Confirme sua senha">
            <button type="button" class="btn-olho toggle-senha" data-target="passwordConfirmation" aria-label="Mostrar senha">
              <i class="bi bi-eye"></i>
            </button>
          </div>

        <button type="submit">Solicitar cadastro</button>
        <p id="mensagem" role="status"></p>
      </form>
      <div class="recado">
        <a href="/login">Voltar ao login</a>
      </div>
    </section>
  </main>
  <script src="register-tester.js"></script>
</body>
</html>
